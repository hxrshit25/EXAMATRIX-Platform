services:
  - type: web
    name: examatrix-api
    runtime: node
    plan: free
    buildCommand: npm install && npm run build -w server
    startCommand: npm run start -w server
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /var/data
    disk:
      name: examatrix-data
      mountPath: /var/data
      sizeGB: 1
